[package]
name = "lumen"
version = "0.1.0"
edition = "2024"
publish = false
description = "A simple, modern photo viewer for Windows."

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
rfd = { version = "0.17.2", default-features = false }
