[package]
name = "lumen"
version = "0.2.0"
edition = "2024"
publish = false
description = "A simple, modern photo viewer for Windows."
license = "GPL-3.0-only"
repository = "https://github.com/Lightre/lumen"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
gif = { version = "0.14", default-features = false, features = ["std"] }
rfd = { version = "0.17.2", default-features = false }
natord = "1.0.9"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winresource = "0.1.34"

[[bench]]
name = "loading"
harness = false
