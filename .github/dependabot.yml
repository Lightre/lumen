version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: build
      include-scope: false
    groups:
      cargo-dependencies:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: build
      include-scope: false
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
