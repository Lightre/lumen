name: Windows Package

on:
  workflow_call:
    inputs:
      release-assets:
        description: Upload the distributable ZIPs and their checksums for a release.
        type: boolean
        default: false
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/package-windows.yml'
      - 'scripts/package-windows.ps1'
      - 'scripts/package-source.ps1'
      - 'scripts/update-third-party-notices.py'
      - 'LICENSE'
      - 'COPYRIGHT'
      - 'BRANDING.md'
      - 'THIRD_PARTY_NOTICES.txt'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
      - name: Test
        run: cargo test --locked --target x86_64-pc-windows-msvc
      - name: Build release
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Package
        id: package
        shell: pwsh
        run: |
          $package = ./scripts/package-windows.ps1 -ExecutablePath ./target/x86_64-pc-windows-msvc/release/lumen.exe
          "name=$($package.Name)" >> $env:GITHUB_OUTPUT
          "directory=$($package.Directory)" >> $env:GITHUB_OUTPUT
          "archive=$($package.Archive)" >> $env:GITHUB_OUTPUT
      - name: Package source
        id: source
        shell: pwsh
        run: |
          $source = ./scripts/package-source.ps1
          "name=$($source.Name)" >> $env:GITHUB_OUTPUT
          "archive=$($source.Archive)" >> $env:GITHUB_OUTPUT
      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.directory }}/lumen.exe
            ${{ steps.package.outputs.directory }}/README.txt
            ${{ steps.package.outputs.directory }}/SHA256SUMS
            ${{ steps.package.outputs.directory }}/LICENSE
            ${{ steps.package.outputs.directory }}/COPYRIGHT
            ${{ steps.package.outputs.directory }}/BRANDING.md
            ${{ steps.package.outputs.directory }}/THIRD_PARTY_NOTICES.txt
            ${{ steps.package.outputs.directory }}/RUST_STANDARD_LIBRARY_NOTICES.html
          if-no-files-found: error
          retention-days: 7
      - name: Prepare release assets
        if: inputs.release-assets
        shell: pwsh
        env:
          WINDOWS_ARCHIVE: ${{ steps.package.outputs.archive }}
          SOURCE_ARCHIVE: ${{ steps.source.outputs.archive }}
        run: |
          $archives = @($env:WINDOWS_ARCHIVE, $env:SOURCE_ARCHIVE)
          $archives | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($_))"
          } | Set-Content -LiteralPath target/packages/SHA256SUMS -Encoding ascii
      - name: Upload release assets
        if: inputs.release-assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.source.outputs.archive }}
            target/packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - name: Upload matching source
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.source.outputs.name }}
          path: ${{ steps.source.outputs.archive }}
          if-no-files-found: error
          retention-days: 7
