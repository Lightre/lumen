name: Windows Package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/package-windows.yml'
      - 'scripts/package-windows.ps1'

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
      - name: Test
        run: cargo test --locked --target x86_64-pc-windows-msvc
      - name: Build release
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Package
        id: package
        shell: pwsh
        run: |
          $package = ./scripts/package-windows.ps1 -ExecutablePath ./target/x86_64-pc-windows-msvc/release/lumen.exe
          "name=$($package.Name)" >> $env:GITHUB_OUTPUT
          "directory=$($package.Directory)" >> $env:GITHUB_OUTPUT
      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.directory }}/lumen.exe
            ${{ steps.package.outputs.directory }}/README.txt
            ${{ steps.package.outputs.directory }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
